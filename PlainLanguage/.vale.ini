# The core is on by default. Add the opt-in word list beside it in your own
# config:
#
#   [*.md]
#   BasedOnStyles = PlainLanguage, Strict
#
# Std is the standard library the sentence, passive, and acronym rules
# extend; sync pulls it in, and it stays present without being enabled.
Packages = https://github.com/vale-cli/Std/releases/latest/download/Std.zip
MinAlertLevel = suggestion

[*.{md,html,txt,rst,adoc,org}]
BasedOnStyles = PlainLanguage
