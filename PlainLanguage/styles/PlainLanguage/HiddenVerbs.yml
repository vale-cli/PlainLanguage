# "Avoid hidden verbs": a verb turned into a noun that needs a second verb
# to carry it, "make a decision" for "decide". Each tense maps to its own.
# The swap list is generated by script/words.py.
extends: substitution
message: "Use the verb: '%s' instead of '%s'."
link: https://github.com/GSA/plainlanguage.gov/blob/main/_pages/guidelines/words/avoid-hidden-verbs.md
level: suggestion
ignorecase: true
matchcase: true
action:
  name: replace
swap:
  '(?:make|reach) a decision': decide
  '(?:makes|reaches) a decision': decides
  '(?:made|reached) a decision': decided
  '(?:making|reaching) a decision': deciding
  'make an application': apply
  'makes an application': applies
  'made an application': applied
  'making an application': applying
  'make (?:a |the )?payment of': pay
  'makes (?:a |the )?payment of': pays
  'made (?:a |the )?payment of': paid
  'making (?:a |the )?payment of': paying
  'make a payment': pay
  'makes a payment': pays
  'made a payment': paid
  'making a payment': paying
  'make a recommendation': recommend
  'makes a recommendation': recommends
  'made a recommendation': recommended
  'making a recommendation': recommending
  'make a suggestion': suggest
  'makes a suggestion': suggests
  'made a suggestion': suggested
  'making a suggestion': suggesting
  'make a determination(?: of)?': determine
  'makes a determination(?: of)?': determines
  'made a determination(?: of)?': determined
  'making a determination(?: of)?': determining
  'make an assumption': assume
  'makes an assumption': assumes
  'made an assumption': assumed
  'making an assumption': assuming
  'make an adjustment(?: to)?': adjust
  'makes an adjustment(?: to)?': adjusts
  'made an adjustment(?: to)?': adjusted
  'making an adjustment(?: to)?': adjusting
  'make a choice': choose
  'makes a choice': chooses
  'made a choice': chose
  'making a choice': choosing
  'make an attempt': try
  'makes an attempt': tries
  'made an attempt': tried
  'making an attempt': trying
  'make an inquiry': ask
  'makes an inquiry': asks
  'made an inquiry': asked
  'making an inquiry': asking
  'make a reduction (?:in|of)': reduce
  'makes a reduction (?:in|of)': reduces
  'made a reduction (?:in|of)': reduced
  'making a reduction (?:in|of)': reducing
  'make a contribution': contribute
  'makes a contribution': contributes
  'made a contribution': contributed
  'making a contribution': contributing
  'make a revision (?:to|of)': revise
  'makes a revision (?:to|of)': revises
  'made a revision (?:to|of)': revised
  'making a revision (?:to|of)': revising
  '(?:conduct|perform|carry out|undertake) an analysis of': analyze
  '(?:conducts|performs|carries out|undertakes) an analysis of': analyzes
  '(?:conducted|performed|carried out|undertook|undertaken) an analysis of': analyzed
  '(?:conducting|performing|carrying out|undertaking) an analysis of': analyzing
  '(?:conduct|perform|carry out|undertake) a review of': review
  '(?:conducts|performs|carries out|undertakes) a review of': reviews
  '(?:conducted|performed|carried out|undertook|undertaken) a review of': reviewed
  '(?:conducting|performing|carrying out|undertaking) a review of': reviewing
  '(?:conduct|perform|carry out|undertake) an investigation (?:of|into)': investigate
  '(?:conducts|performs|carries out|undertakes) an investigation (?:of|into)': investigates
  '(?:conducted|performed|carried out|undertook|undertaken) an investigation (?:of|into)': investigated
  '(?:conducting|performing|carrying out|undertaking) an investigation (?:of|into)': investigating
  '(?:conduct|perform|carry out|undertake) an assessment of': assess
  '(?:conducts|performs|carries out|undertakes) an assessment of': assesses
  '(?:conducted|performed|carried out|undertook|undertaken) an assessment of': assessed
  '(?:conducting|performing|carrying out|undertaking) an assessment of': assessing
  '(?:conduct|perform|carry out|undertake) an evaluation of': evaluate
  '(?:conducts|performs|carries out|undertakes) an evaluation of': evaluates
  '(?:conducted|performed|carried out|undertook|undertaken) an evaluation of': evaluated
  '(?:conducting|performing|carrying out|undertaking) an evaluation of': evaluating
  '(?:conduct|perform|carry out|undertake) an inspection of': inspect
  '(?:conducts|performs|carries out|undertakes) an inspection of': inspects
  '(?:conducted|performed|carried out|undertook|undertaken) an inspection of': inspected
  '(?:conducting|performing|carrying out|undertaking) an inspection of': inspecting
  '(?:conduct|perform|carry out|undertake) an examination of': examine
  '(?:conducts|performs|carries out|undertakes) an examination of': examines
  '(?:conducted|performed|carried out|undertook|undertaken) an examination of': examined
  '(?:conducting|performing|carrying out|undertaking) an examination of': examining
  '(?:conduct|perform|carry out|undertake) the calculation of': calculate
  '(?:conducts|performs|carries out|undertakes) the calculation of': calculates
  '(?:conducted|performed|carried out|undertook|undertaken) the calculation of': calculated
  '(?:conducting|performing|carrying out|undertaking) the calculation of': calculating
  'give consideration to': consider
  'gives consideration to': considers
  '(?:gave|given) consideration to': considered
  'giving consideration to': considering
  'take into consideration': consider
  'takes into consideration': considers
  '(?:took|taken) into consideration': considered
  'taking into consideration': considering
  '(?:give|provide) an explanation of': explain
  '(?:gives|provides) an explanation of': explains
  '(?:gave|given|provided) an explanation of': explained
  '(?:giving|providing) an explanation of': explaining
  '(?:give|provide) a description of': describe
  '(?:gives|provides) a description of': describes
  '(?:gave|given|provided) a description of': described
  '(?:giving|providing) a description of': describing
  '(?:give|provide) assistance(?: to)?': help
  '(?:gives|provides) assistance(?: to)?': helps
  '(?:gave|given|provided) assistance(?: to)?': helped
  '(?:giving|providing) assistance(?: to)?': helping
  'give approval for': approve
  'gives approval for': approves
  '(?:gave|given) approval for': approved
  'giving approval for': approving
  'give authorization for': authorize
  'gives authorization for': authorizes
  '(?:gave|given) authorization for': authorized
  'giving authorization for': authorizing
  'have a need for': need
  'has a need for': needs
  'had a need for': needed
  'having a need for': needing
  'have a discussion (?:of|about)': discuss
  'has a discussion (?:of|about)': discusses
  'had a discussion (?:of|about)': discussed
  'having a discussion (?:of|about)': discussing
  'have an impact on': affect
  'has an impact on': affects
  'had an impact on': affected
  'having an impact on': affecting
  'have a tendency to': tend to
  'has a tendency to': tends to
  'had a tendency to': tended to
  'having a tendency to': tending to
  '(?:gain|have) an understanding of': understand
  '(?:gains|has) an understanding of': understands
  '(?:gained|had) an understanding of': understood
  '(?:gaining|having) an understanding of': understanding
  'reach an agreement': agree
  'reaches an agreement': agrees
  'reached an agreement': agreed
  'reaching an agreement': agreeing
  'reach a conclusion': conclude
  'reaches a conclusion': concludes
  'reached a conclusion': concluded
  'reaching a conclusion': concluding

tests:
  - name: fires
    input: |
      We made a decision to conduct an analysis of the data, and you must make an application in writing.
    want: |
      1:4:PlainLanguage.HiddenVerbs:Use the verb: 'decided' instead of 'made a decision'.
      1:23:PlainLanguage.HiddenVerbs:Use the verb: 'analyze' instead of 'conduct an analysis of'.
      1:69:PlainLanguage.HiddenVerbs:Use the verb: 'apply' instead of 'make an application'.
  - name: tenses
    input: |
      They are giving consideration to it, and the board has taken into consideration the costs.
    want: |
      1:10:PlainLanguage.HiddenVerbs:Use the verb: 'considering' instead of 'giving consideration to'.
      1:56:PlainLanguage.HiddenVerbs:Use the verb: 'considered' instead of 'taken into consideration'.
  - name: clean
    input: |
      We decided to analyze the data, and you must apply in writing. The decision was made last week.
    want: ""
