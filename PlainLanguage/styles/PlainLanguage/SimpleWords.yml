tests:
  - name: fires
    input: |
      We will commence the review prior to June and utilize the results in order to ensure accuracy.
    want: |
      1:9:PlainLanguage.SimpleWords:Use 'start' or 'begin' instead of 'commence'.
      1:29:PlainLanguage.SimpleWords:Use 'before' instead of 'prior to'.
      1:47:PlainLanguage.SimpleWords:Use 'use' instead of 'utilize'.
      1:67:PlainLanguage.SimpleWords:Use 'to' instead of 'in order to'.
      1:79:PlainLanguage.SimpleWords:Use 'make sure' instead of 'ensure'.
  - name: clean
    input: |
      We will start the review before June and use the results to make sure they are right.
    want: ""
