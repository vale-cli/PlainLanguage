# "Use active voice": a form of "be" and a past participle, "must be
# included", "were proposed". Std has the participles; participles used as
# adjectives, and verbs that read as states, are left out.
extends: Std.Grammar.PassiveVoice
message: "'%s' is passive. Say who does it."
link: https://github.com/GSA/plainlanguage.gov/blob/main/_pages/guidelines/conversational/use-active-voice.md
level: suggestion
# Std's prefix, with room for an adverb: "are automatically added".
raw:
  - \b(am|are|were|being|is|been|was|be)\b\s*(?:\w+ly\s+)?
exceptions:
  - gone
  - supposed
  - tired
  - interested
  - concerned
  - pleased
  - married
  - disabled
  - retired
  - deceased
  - qualified
  - located
  - based
  - called
  - named
  - needed
  - designed
  - committed
  - dedicated
  - experienced
  - advanced
  - limited
  - detailed
  - supported
  - enabled
  - installed
  - related
  - involved
  - expected
  - allowed
  - required
  - included
  - satisfied
  - determined
  - confused
  - excited
  - embarrassed
  - worried
  - scared
  - surprised
  - closed
  - opened
  - finished
  - indeed
  - aged
  - blessed
  - hundred

tests:
  - name: fires
    input: |
      New regulations were proposed. The lake was polluted by the company, and bonds will be withheld.
    want: |
      1:17:PlainLanguage.PassiveVoice:'were proposed' is passive. Say who does it.
      1:41:PlainLanguage.PassiveVoice:'was polluted' is passive. Say who does it.
      1:85:PlainLanguage.PassiveVoice:'be withheld' is passive. Say who does it.
  - name: adverbs and irregular participles
    input: |
      The forms are automatically sent, and the fee is split.
    want: |
      1:11:PlainLanguage.PassiveVoice:'are automatically sent' is passive. Say who does it.
      1:47:PlainLanguage.PassiveVoice:'is split' is passive. Say who does it.
  - name: clean
    input: |
      We proposed new regulations. The company polluted the lake. The office is located in Denver, and you are required to sign. I am interested, I used to live there, and the form is gone.
    want: ""
