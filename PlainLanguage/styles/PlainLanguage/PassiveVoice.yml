# "Use active voice": a form of "be" and a past participle, "must be
# included", "were proposed". Participles used as adjectives, and verbs
# that read as states in instructions, are left out.
extends: existence
message: "'%s' is passive. Say who does it."
link: https://github.com/GSA/plainlanguage.gov/blob/main/_pages/guidelines/conversational/use-active-voice.md
level: suggestion
ignorecase: true
tokens:
  - '\b(?:am|are|is|was|were|be|been|being)\s+(?:being\s+)?(?:\w+ly\s+)?(?!(?:used|supposed|going) to\b)(?:\w{2,}ed|beaten|begun|bitten|bought|brought|built|caught|chosen|dealt|done|drawn|driven|forbidden|forgotten|given|held|hidden|kept|known|laid|led|lost|made|meant|paid|proven|sent|shown|sold|spent|spoken|stolen|taken|taught|thrown|told|understood|withheld|written)\b'
exceptions:
  - tired
  - interested
  - concerned
  - pleased
  - married
  - disabled
  - retired
  - deceased
  - qualified
  - located
  - based
  - called
  - named
  - needed
  - designed
  - committed
  - dedicated
  - experienced
  - advanced
  - limited
  - detailed
  - supported
  - enabled
  - installed
  - related
  - involved
  - expected
  - allowed
  - required
  - included
  - satisfied
  - determined
  - confused
  - excited
  - embarrassed
  - worried
  - scared
  - surprised
  - closed
  - opened
  - finished
  - indeed
  - aged
  - blessed
  - hundred

tests:
  - name: fires
    input: |
      New regulations were proposed. The lake was polluted by the company, and bonds will be withheld.
    want: |
      1:17:PlainLanguage.PassiveVoice:'were proposed' is passive. Say who does it.
      1:41:PlainLanguage.PassiveVoice:'was polluted' is passive. Say who does it.
      1:85:PlainLanguage.PassiveVoice:'be withheld' is passive. Say who does it.
  - name: clean
    input: |
      We proposed new regulations. The company polluted the lake. The office is located in Denver, and you are required to sign. I am interested, and I used to live there.
    want: ""
