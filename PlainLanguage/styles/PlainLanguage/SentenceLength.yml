# "Write short sentences": one idea in each. The guidelines give no number;
# 25 words is a common ceiling, and a parameter.
extends: occurrence
message: "%d words in one sentence. Split it, one idea in each."
link: https://github.com/GSA/plainlanguage.gov/blob/main/_pages/guidelines/concise/write-short-sentences.md
level: suggestion
scope: sentence
max: 25
token: '\b\w+\b'

tests:
  - name: fires
    input: |
      If you take less than your entitled share of production for any month, but you pay royalties on the full volume of your entitled share, you owe nothing more.
    want: |
      1:1:PlainLanguage.SentenceLength:29 words in one sentence. Split it, one idea in each.
  - name: clean
    input: |
      Suppose you pay royalties on your full share but take less than it. In this case, you owe nothing more.
    want: ""
