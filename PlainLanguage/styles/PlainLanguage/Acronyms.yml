# "Minimize abbreviations": define one the first time you use it, as
# "Engineering Safety Advisory Committee (ESAC)" or "ESAC (Engineering
# Safety Advisory Committee)". Those that have entered common usage need
# no definition; add your own to a vocabulary.
extends: conditional
message: "'%s' has no definition. Spell it out the first time, or use a short name instead."
link: https://github.com/GSA/plainlanguage.gov/blob/main/_pages/guidelines/words/minimize-abbreviations.md
level: suggestion
ignorecase: false
first: '\b([A-Z]{2,5})s?\b'
second: '\w+\s+\(([A-Z]{2,5})s?\)|\b([A-Z]{2,5})s?\s+\([A-Z][a-z]'
exceptions:
  # The guidelines' examples of abbreviations everyone knows.
  - ATM
  - BMW
  - CIA
  - FBI
  - IBM
  # Others in that class.
  - AM
  - PM
  - OK
  - TV
  - US
  - USA
  - UK
  - EU
  - UN
  - ID
  - DC
  - CEO
  - FAQ
  - PDF
  - PIN
  - ZIP
  - ASAP
  # Admonition labels, which are words.
  - NOTE
  - TIP
  # Roman numerals.
  - II
  - III
  - IV
  - VI
  - VII
  - VIII
  - IX
  - XI
  - XII

tests:
  - name: fires
    input: |
      Send the form to ESAC. The Small Business Administration (SBA) reviews it, and ESAC approves it.
    want: |
      1:18:PlainLanguage.Acronyms:'ESAC' has no definition. Spell it out the first time, or use a short name instead.
      1:80:PlainLanguage.Acronyms:'ESAC' has no definition. Spell it out the first time, or use a short name instead.
  - name: clean
    input: |
      The Engineering Safety Advisory Committee (ESAC) meets monthly. ESAC (the committee) sends the FBI and the IRS (Internal Revenue Service) a copy.
    want: ""
