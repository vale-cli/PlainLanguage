      1:17:Strict.Words:Use 'give' or 'offer' instead of 'provide'.
      1:56:Strict.Words:Use 'give' or 'send' instead of 'submit'.
      1:71:Strict.Words:Use 'ask' instead of 'request'.
  - name: clean
    input: |
      The office will give you the forms, and you must send them to us to ask for a permit.
    want: ""
