# The configs the README tells you to write, one per fixture, with the
# package's styles read from the tree instead of a sync. test.sh copies this
# file beside an assembled StylesPath that has Std in it, which the sentence,
# passive, and acronym rules extend.
StylesPath = PlainLanguage/styles
MinAlertLevel = suggestion

[{fixtures,fixtures/clean}/page.md]
BasedOnStyles = PlainLanguage, Strict

[{fixtures,fixtures/clean}/page.html]
BasedOnStyles = PlainLanguage, Strict
