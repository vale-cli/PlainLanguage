name: Build + Test

on: [push, pull_request]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The archive is what users install, so the license and the attribution
      # for the transcribed word lists travel inside it.
      - run: cp LICENSE NOTICE PlainLanguage/

      - run: zip -r PlainLanguage.zip PlainLanguage -x "*.DS_Store"

      - name: Upload style to release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: PlainLanguage.zip

  test:
    runs-on: ubuntu-latest
    env:
      VALE_VERSION: 3.28.1
    steps:
      - uses: actions/checkout@v4

      - run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sfL "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" |
            tar xz -C "$RUNNER_TEMP/bin" vale
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4
        with:
          repository: vale-cli/Std
          path: std-src

      # Std present on the StylesPath but not enabled, the shape sync leaves.
      - run: ./test.sh
        env:
          STD: ${{ github.workspace }}/std-src/Std
